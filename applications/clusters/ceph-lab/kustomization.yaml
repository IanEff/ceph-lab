apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  # Infrastructure (waves -15 → 10): Gateway API, Cilium, cert-manager,
  # observability stack, secrets, policies, ArgoCD ingress
  - infra-set.yaml

  # Rook Ceph (waves 20 → 35): operator → cluster → storage → routes
  # Individual Applications here so each gets its own sync policy.
  - rook-operator.yaml
  - rook-cluster.yaml
  - rook-storage.yaml
  - rook-gateway.yaml
