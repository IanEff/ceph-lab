apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-set
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@github.com:ianeff/ceph-lab.git
        revision: HEAD
        files:
          - path: applications/infrastructure/**/config.json
  template:
    metadata:
      name: "{{appName}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
    spec:
      project: default
      source:
        repoURL: git@github.com:ianeff/ceph-lab.git
        targetRevision: HEAD
        path: "{{localPath}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # ArgoCD's default retry budget gives up permanently after a handful
        # of attempts, which loses races against CRD-registration during a
        # cold multi-wave bootstrap (an Application whose CRDs haven't landed
        # yet — e.g. a ServiceMonitor before prometheus-operator-crds settles,
        # see gotcha #7 — fails its first sync and then just sits there).
        # selfHeal:true alone doesn't help — it only corrects drift on an
        # already-synced app, it doesn't retry an abandoned initial sync.
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
