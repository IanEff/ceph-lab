---
# S3 / RGW HTTPRoute — routes s3-shared.ceph.lab → the shared cephobjectstore on port 80
# TLS terminates at the Cilium Gateway; backend is cleartext HTTP to RGW.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-s3-shared
  namespace: rook-ceph
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - s3-shared.ceph.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: rook-ceph-rgw-ceph-shared-objectstore
          port: 80
          weight: 1
