apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph

resources:
  - namespace.yaml

helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: v1.19.1
    releaseName: rook-ceph
    namespace: rook-ceph
    valuesInline:
      # No Prometheus Operator in this cluster — Grafana scrapes the MGR directly.
      monitoring:
        enabled: false
      csi:
        enableRbdDriver: true
        enableCephfsDriver: true
      # Tune resource requests to coexist with Ceph daemons on worker nodes
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
