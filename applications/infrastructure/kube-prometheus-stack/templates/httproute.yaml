apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - "grafana.{{ .Values.cluster.domain }}"
  parentRefs:
    - kind: Gateway
      name: cilium-gateway
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
