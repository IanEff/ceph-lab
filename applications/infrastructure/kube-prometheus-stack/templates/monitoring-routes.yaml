---
# Exposes Prometheus at https://prometheus.ceph.lab via the Cilium Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: prometheus
    namespace: monitoring
spec:
    hostnames:
        - "prometheus.{{ .Values.cluster.domain }}"
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: cilium-gateway
          namespace: kube-system
          sectionName: https
    rules:
        - matches:
              - path:
                    type: PathPrefix
                    value: /
          backendRefs:
              - group: ""
                kind: Service
                name: kube-prometheus-stack-prometheus
                port: 9090
                weight: 1
---
# Exposes Alertmanager at https://alertmanager.ceph.lab via the Cilium Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: alertmanager
    namespace: monitoring
spec:
    hostnames:
        - "alertmanager.{{ .Values.cluster.domain }}"
    parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: cilium-gateway
          namespace: kube-system
          sectionName: https
    rules:
        - matches:
              - path:
                    type: PathPrefix
                    value: /
          backendRefs:
              - group: ""
                kind: Service
                name: kube-prometheus-stack-alertmanager
                port: 9093
                weight: 1
