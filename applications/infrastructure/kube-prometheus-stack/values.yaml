# domain is used by the Helm template for the Grafana HTTPRoute hostname
cluster:
  domain: ceph.lab

kube-prometheus-stack:
  grafana:
    adminPassword: "password"   # change in production
    service:
      type: ClusterIP
    grafana.ini:
      server:
        root_url: "https://grafana.ceph.lab/"
    # Sidecar auto-imports ConfigMaps labelled grafana_dashboard=1
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
      datasources:
        defaultDatasourceEnabled: false
    additionalDataSources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true


  prometheus:
    prometheusSpec:
      replicas: 1
      retention: 15d
      retentionSize: 8GB
      enableRemoteWriteReceiver: true
      # Discover all ServiceMonitors across all namespaces (picks up Rook's)
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1536Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Disable heavyweight default scrapers we don't need in a lab
  kubeEtcd:
    enabled: false   # k3s uses SQLite, no etcd

  defaultRules:
    rules:
      etcd: false
