apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

components:
  - ../../config

resources:
  - gateway.yaml
  - hubble-ui-route.yaml
  - hubble-relay-route.yaml
  - lb-pool.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.18.2
    releaseName: cilium
    namespace: kube-system
    includeCRDs: true
    valuesFile: values.yaml
    valuesInline:
      # Injected from cluster-config — keep in sync with gitops.env
      k8sServiceHost: 192.168.56.50
      k8sServicePort: 6443
      ipv4NativeRoutingCIDR: 10.244.0.0/16
