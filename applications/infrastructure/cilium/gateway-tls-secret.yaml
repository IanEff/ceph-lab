# Static self-signed wildcard TLS cert for *.ceph.lab — consumed by the
# Cilium Gateway HTTPS listener. Generated once; 10-year validity.
# CLI uses --insecure so no host-OS trust is needed.
#
# To regenerate:
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -days 3650 -nodes \
#     -subj "/CN=ceph.lab" \
#     -addext "subjectAltName=DNS:ceph.lab,DNS:*.ceph.lab,IP:192.168.56.200" \
#     -keyout gw.key -out gw.crt
#   kubectl create secret tls gateway-tls -n kube-system --cert=gw.crt --key=gw.key --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: gateway-tls
  namespace: kube-system
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
