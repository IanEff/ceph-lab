apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: ceph-lab-pool
spec:
  blocks:
    - cidr: "192.168.56.192/27"   # patched from LB_CIDR via Kustomize (.200–.222)
  allowFirstLastIPs: "No"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: ceph-lab-l2
spec:
  # All nodes can participate; Cilium elects one ARP responder per service
  nodeSelector:
    matchLabels: {}
  interfaces:
    - "^eth"    # Lima vz NIC pattern (eth0=vzNAT, eth1=ceph-lab host-only)
  externalIPs: false
  loadBalancerIPs: true
