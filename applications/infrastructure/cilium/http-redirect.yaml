apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: kube-system
spec:
  hostnames:
    - "*.ceph.lab"     # patched from WILDCARD_DOMAIN via Kustomize
  parentRefs:
    - kind: Gateway
      name: cilium-gateway
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
