# cert-manager issues a self-signed CA that signs this wildcard cert.
# The IP address and dnsNames are patched by Kustomize replacements from gitops.env.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: kube-system
spec:
  secretName: gateway-tls
  duration: 2160h      # 90 days
  renewBefore: 360h    # renew 15 days before expiry
  commonName: "*.ceph.lab"        # patched from WILDCARD_DOMAIN
  dnsNames:
    - "*.ceph.lab"                # patched from WILDCARD_DOMAIN
    - "ceph.lab"                  # patched from DOMAIN
    - "localhost"
  ipAddresses:
    - "192.168.56.200"            # patched from GATEWAY_IP
  issuerRef:
    name: ceph-lab-ca
    kind: ClusterIssuer
    group: cert-manager.io
