# Object Bucket Claim — creates the bucket and a Secret with credentials
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: traffic-generator-bucket
  namespace: default
spec:
  generateBucketName: traffic-gen
  storageClassName: rook-ceph-bucket
---
# Traffic Generator — waits for manual activation via kubectl exec
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-traffic-generator
  namespace: default
  labels:
    app: s3-traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-traffic-generator
  template:
    metadata:
      labels:
        app: s3-traffic-generator
    spec:
      containers:
        - name: traffic-gen
          image: peakcom/s5cmd:v2.2.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for bucket credentials..."
              until [ -f /s3/AWS_ACCESS_KEY_ID ]; do sleep 2; done
              
              # Create a helper script for the user
              cat <<'EOF' > /start-traffic.sh
              #!/bin/sh
              export AWS_ACCESS_KEY_ID=$(cat /s3/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /s3/AWS_SECRET_ACCESS_KEY)
              export S3_ENDPOINT="http://$(cat /s3/BUCKET_HOST):$(cat /s3/BUCKET_PORT)"
              export BUCKET_NAME=$(cat /s3/BUCKET_NAME)
              
              echo "Starting traffic generation on bucket: ${BUCKET_NAME} at ${S3_ENDPOINT}"
              head -c 1024 /dev/urandom > /tmp/dummy.txt
              
              while true; do
                for i in $(seq 1 10); do
                  /s5cmd --endpoint-url ${S3_ENDPOINT} cp /tmp/dummy.txt s3://${BUCKET_NAME}/load-test-$(date +%s)-${i}.txt
                done
                /s5cmd --endpoint-url ${S3_ENDPOINT} ls s3://${BUCKET_NAME}/
                sleep 5
                /s5cmd --endpoint-url ${S3_ENDPOINT} rm "s3://${BUCKET_NAME}/load-test-*"
                sleep 2
              done
              EOF
              
              chmod +x /start-traffic.sh
              echo "✅ Environment ready. To start traffic, run:"
              echo "   kubectl exec -it $(hostname) -- /start-traffic.sh"
              
              # Sleep forever waiting for user
              tail -f /dev/null
          volumeMounts:
            - name: s3-creds
              mountPath: /s3
              readOnly: true
      volumes:
        - name: s3-creds
          projected:
            sources:
              - configMap:
                  name: traffic-generator-bucket
              - secret:
                  name: traffic-generator-bucket
