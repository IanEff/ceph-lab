apiVersion: v1
kind: ConfigMap
metadata:
  name: elk-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Elk SLO"
data:
  elk-slo-dashboard.json: |-
    {
      "uid": "elk-slo-v1",
      "title": "Elk SLO View",
      "tags": ["elk", "slo", "ceph"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "1m",
      "time": { "from": "now-3h", "to": "now" },
      "timepicker": {},
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "text",
          "id": 1,
          "title": "SLO Definitions",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 5 },
          "options": {
            "mode": "markdown",
            "content": "## Elk Service Level Objectives\n\nThese SLOs are measured over a **rolling 28-day compliance window**.\n\n| CUJ | SLO | Target | Error Budget |\n|-----|-----|--------|--------------|\n| **Tick-Ingest (Write CUJ)** | 99% of OSD writes complete in < 50 ms | 99% | 1% → ~7h 12m per 28 days |\n| **Simulation (Read CUJ)** | 99% of OSD reads complete in < 50 ms | 99% | 1% → ~7h 12m per 28 days |\n\n**Burn-rate thresholds** — Fast burn (1 h window): **14.4×** triggers `CephWriteSLOFastBurn` (critical). Slow burn (6 h window): **6×** indicates sustained degradation.\n\n> Latency metrics are in **seconds**. 50 ms = 0.05 s.",
            "code": { "language": "plaintext", "showLineNumbers": false, "showMiniMap": false }
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Cluster Health",
          "description": "0 = OK · 1 = WARN · 2 = ERR",
          "gridPos": { "x": 0, "y": 5, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "OK",   "color": "green", "index": 0 } } },
                { "type": "value", "options": { "1": { "text": "WARN", "color": "yellow", "index": 1 } } },
                { "type": "value", "options": { "2": { "text": "ERR",  "color": "red", "index": 2 } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red",    "value": 2 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "ceph_health_status",
              "legendFormat": "Health",
              "refId": "A"
            }
          ]
        },
        {
          "type": "gauge",
          "id": 3,
          "title": "Cluster Capacity Used",
          "gridPos": { "x": 4, "y": 5, "w": 8, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red",    "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "ceph_cluster_total_used_bytes / ceph_cluster_total_bytes * 100",
              "legendFormat": "Used %",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Slow Ops",
          "gridPos": { "x": 12, "y": 5, "w": 6, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red",    "value": 10 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "ceph_healthcheck_slow_ops",
              "legendFormat": "Slow Ops",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "id": 5,
          "title": "OSD Flaps (15 m, market-hours sensitive)",
          "description": "Number of OSD up/down state changes in the last 15 minutes.",
          "gridPos": { "x": 18, "y": 5, "w": 6, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red",    "value": 3 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(changes(ceph_osd_up[15m]))",
              "legendFormat": "OSD Flaps",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "Tick-Ingest Write Latency P99",
          "description": "SLO target: 99% of OSD writes < 50 ms (0.05 s). Red line = SLO threshold.",
          "gridPos": { "x": 0, "y": 9, "w": 12, "h": 8 },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red",   "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(ceph_osd_op_w_latency_bucket[5m])) by (le))",
              "legendFormat": "Write P99",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Simulation Read Latency P99",
          "description": "SLO target: 99% of OSD reads < 50 ms (0.05 s). Red line = SLO threshold.",
          "gridPos": { "x": 12, "y": 9, "w": 12, "h": 8 },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red",   "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(ceph_osd_op_r_latency_bucket[5m])) by (le))",
              "legendFormat": "Read P99",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "HPC MDS Reply Latency P99",
          "description": "CephFS metadata server reply latency at the 99th percentile.",
          "gridPos": { "x": 0, "y": 17, "w": 12, "h": 8 },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red",   "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, rate(ceph_mds_reply_latency_bucket[5m]))",
              "legendFormat": "MDS Reply P99",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "1 h Error Budget Burn Rate (Write SLO)",
          "description": "Fast-burn threshold: 14.4×. Exceeding this for 5 m triggers CephWriteSLOFastBurn (critical).",
          "gridPos": { "x": 12, "y": 17, "w": 12, "h": 8 },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "red",    "value": 14.4 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "slo:ceph_osd_write_latency_burn_rate:1h",
              "legendFormat": "1h Burn Rate",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "6 h Error Budget Burn Rate (Write SLO)",
          "description": "Slow-burn threshold: 6×. Sustained values above this indicate ongoing SLO degradation.",
          "gridPos": { "x": 0, "y": 25, "w": 12, "h": 8 },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 6 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "slo:ceph_osd_write_latency_burn_rate:6h",
              "legendFormat": "6h Burn Rate",
              "refId": "A"
            }
          ]
        }
      ]
    }
