apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  hostnames:
    - "argocd.ceph.lab"   # patched from ARGOCD_HOSTNAME via Kustomize
  parentRefs:
    - kind: Gateway
      name: cilium-gateway
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
