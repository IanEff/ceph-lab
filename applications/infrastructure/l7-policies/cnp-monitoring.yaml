# L7 visibility for the monitoring namespace (Prometheus, Grafana, Alertmanager).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: l7-visibility
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }   # Prometheus
            - { port: "3000", protocol: TCP }   # Grafana
            - { port: "9093", protocol: TCP }   # Alertmanager
            - { port: "9091", protocol: TCP }   # Pushgateway
            - { port: "80",   protocol: TCP }
          rules:
            http: [{}]
    - fromEntities: [host, remote-node]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [cluster, kube-apiserver, world]
      toPorts:
        - ports:
            - { port: "80",   protocol: TCP }
            - { port: "443",  protocol: TCP }
            - { port: "6443", protocol: TCP }
