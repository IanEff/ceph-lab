# L7 visibility for ArgoCD namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: l7-visibility
  namespace: argocd
spec:
  endpointSelector: {}
  ingress:
    # Allow all intra-cluster traffic (ArgoCD internal gRPC, Redis, Dex, etc.)
    - fromEntities: [cluster]
    - fromEntities: [host, remote-node]
    # L7 visibility on HTTP-speaking ports
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - { port: "80",   protocol: TCP }
            - { port: "443",  protocol: TCP }
            - { port: "8080", protocol: TCP }   # argocd-server HTTP
            - { port: "8083", protocol: TCP }   # argocd-server metrics
          rules:
            http: [{}]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    # Allow all internal cluster traffic (repo-server gRPC, Redis, Dex, etc.)
    - toEntities: [cluster, kube-apiserver]
    # Restrict outbound world traffic (GitHub SSH for git ops, HTTPS for OCI/charts)
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "80",   protocol: TCP }
            - { port: "443",  protocol: TCP }
            - { port: "22",   protocol: TCP }   # git over SSH
