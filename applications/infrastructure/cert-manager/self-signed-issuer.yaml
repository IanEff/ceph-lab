# Bootstrap PKI for *.ceph.lab TLS:
#   ceph-lab-ca-keypair Secret (committed, fixed) → ceph-lab-ca ClusterIssuer
#
# The CA keypair is pre-generated and committed to the repo (ceph-lab-ca-secret.yaml).
# This means the SAME CA is used on every cluster rebuild — trust it once:
#   bash provisioning/scripts/trust_ca.sh
#
# The ceph-lab-ca ClusterIssuer signs the gateway-tls wildcard cert.
# There is intentionally NO cert-manager Certificate resource for the CA itself —
# that would cause cert-manager to regenerate the CA on each rebuild.

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ceph-lab-ca
spec:
  ca:
    secretName: ceph-lab-ca-keypair
