# Fixed CA Secret — generated once and committed to the repo.
# This ensures the same CA cert is used on every 'vagrant up', so you only
# need to trust it in the macOS Keychain once:
#
#   bash provisioning/scripts/trust_ca.sh
#
# To regenerate (if you want a brand-new CA and are willing to re-trust):
#   openssl genrsa -out /tmp/ceph-lab-ca.key 4096
#   openssl req -x509 -new -nodes -key /tmp/ceph-lab-ca.key -sha256 -days 3650 \
#     -out /tmp/ceph-lab-ca.crt -subj "/CN=ceph-lab-ca/O=ceph-lab"
#   python3 /tmp/write_ca_secret.py
apiVersion: v1
kind: Secret
metadata:
  name: ceph-lab-ca-keypair
  namespace: cert-manager
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
