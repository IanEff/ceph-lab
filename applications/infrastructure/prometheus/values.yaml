# Standalone Prometheus — single-process, no operator.
# Picks up all ServiceMonitors and PrometheusRules cluster-wide
# (including the ones Rook's operator creates in rook-ceph).

server:
  replicaCount: 1

  retention: "15d"
  retentionSize: "8GB"

  # Use CephFS RWO for metrics storage.
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: "" # uses cluster default (ceph-block)

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # Enable remote_write receiver so Alloy can push additional metrics.
  remoteWrite: []
  extraFlags:
    - web.enable-remote-write-receiver

  # Discover ServiceMonitors and PrometheusRules across all namespaces so
  # Rook's auto-created ServiceMonitors (rook-ceph namespace) are scraped.
  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s

  # Emit cluster label on all series for multi-cluster Grafana queries.
  extraScrapeConfigs: |
    - job_name: 'prometheus-self'
      static_configs:
        - targets: ['localhost:9090']

alertmanager:
  enabled: false # Lab: no paging. Use Grafana unified alerting instead.

# node-exporter and kube-state-metrics are included in the chart.
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# pushgateway not needed in a lab.
prometheus-pushgateway:
  enabled: false

# Tell Prometheus to also discover ServiceMonitors (CRD-based scraping).
# The standalone chart supports this natively via serverFiles.
serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
    scrape_configs:
      # ServiceMonitor-style discovery: scrape all services with the
      # prometheus.io/scrape annotation as well as rook-ceph metrics.
      - job_name: "kubernetes-service-endpoints"
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_scrape ]
            action: keep
            regex: "true"
          - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_path ]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [ __address__, __meta_kubernetes_service_annotation_prometheus_io_port ]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [ __meta_kubernetes_namespace ]
            target_label: namespace
          - source_labels: [ __meta_kubernetes_service_name ]
            target_label: service

      # Rook-ceph MGR metrics (port 9283) — scraped directly regardless of annotation.
      - job_name: "rook-ceph-mgr"
        static_configs:
          - targets:
              - "rook-ceph-mgr.rook-ceph.svc.cluster.local:9283"
        relabel_configs:
          - target_label: job
            replacement: rook-ceph-mgr

      # Rook operator metrics (port 2112).
      - job_name: "rook-ceph-operator"
        static_configs:
          - targets:
              - "rook-ceph-operator-metrics.rook-ceph.svc.cluster.local:2112"
        relabel_configs:
          - target_label: job
            replacement: rook-ceph-operator

      # Hubble metrics (Cilium flow observability).
      - job_name: "hubble-metrics"
        static_configs:
          - targets:
              - "hubble-metrics.kube-system.svc.cluster.local:9965"
        relabel_configs:
          - target_label: job
            replacement: hubble
