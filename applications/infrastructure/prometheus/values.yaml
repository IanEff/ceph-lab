# Standalone Prometheus — single-process, no operator.
# Picks up all ServiceMonitors and PrometheusRules cluster-wide
# (including the ones Rook's operator creates in rook-ceph).

server:
  replicaCount: 1

  retention: "7d"
  retentionSize: "5GB"

  # Use CephFS RWO for metrics storage.
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: "" # uses cluster default (ceph-block)

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - ceph-control

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s

  # Emit cluster label on all series for multi-cluster Grafana queries.
  extraScrapeConfigs: |
    - job_name: 'prometheus-self'
      static_configs:
        - targets: ['localhost:9090']

alertmanager:
  enabled: false # Lab: no paging. Use Grafana unified alerting instead.

# node-exporter and kube-state-metrics are included in the chart.
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# pushgateway not needed in a lab.
prometheus-pushgateway:
  enabled: false

# Tell Prometheus to also discover ServiceMonitors (CRD-based scraping).
# The standalone chart supports this natively via serverFiles.
serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
    scrape_configs:
      # The chart's default scrape_configs already cover kubernetes-service-endpoints,
      # kubernetes-nodes, kubernetes-pods, etc. Only add custom targets below.

      # Rook-ceph MGR metrics (port 9283) — scraped directly regardless of annotation.
      - job_name: "rook-ceph-mgr"
        static_configs:
          - targets:
              - "rook-ceph-mgr.rook-ceph.svc.cluster.local:9283"
        relabel_configs:
          - target_label: job
            replacement: rook-ceph-mgr

      # Rook operator metrics (port 2112).
      - job_name: "rook-ceph-operator"
        static_configs:
          - targets:
              - "rook-ceph-operator-metrics.rook-ceph.svc.cluster.local:2112"
        relabel_configs:
          - target_label: job
            replacement: rook-ceph-operator

      # Hubble metrics (Cilium flow observability).
      - job_name: "hubble-metrics"
        static_configs:
          - targets:
              - "hubble-metrics.kube-system.svc.cluster.local:9965"
        relabel_configs:
          - target_label: job
            replacement: hubble
