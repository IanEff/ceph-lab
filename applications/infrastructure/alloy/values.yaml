alloy:
  # Run as DaemonSet so every node's pod logs and Ceph OSD logs are collected
  configMap:
    create: true
    content: |
      // ── Prometheus remote write destination ──────────────────────────────
      prometheus.remote_write "default" {
        endpoint {
          url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }

      // ── Loki write destination ────────────────────────────────────────────
      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // ── Hubble metrics scrape ─────────────────────────────────────────────
      // Hubble exposes per-flow metrics at hubble-metrics.kube-system:9965
      prometheus.scrape "hubble_metrics" {
        targets    = [{ __address__ = "hubble-metrics.kube-system:9965" }]
        forward_to = [prometheus.remote_write.default.receiver]
        job_name   = "hubble"
        scrape_interval = "15s"
      }

      // ── Pod annotation scraping (prometheus.io/scrape=true) ───────────────
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "annotated_pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          action        = "keep"
          regex         = "true"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          action        = "replace"
          target_label  = "__metrics_path__"
          regex         = "(.+)"
        }
        rule {
          source_labels = ["__address__",
                           "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          action        = "replace"
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "annotated_pods" {
        targets    = discovery.relabel.annotated_pods.output
        forward_to = [prometheus.remote_write.default.receiver]
        scrape_interval = "30s"
      }

      // ── Kubernetes event logs → Loki ──────────────────────────────────────
      loki.source.kubernetes_events "events" {
        forward_to = [loki.write.default.receiver]
      }

      // ── Pod log collection → Loki ─────────────────────────────────────────
      discovery.kubernetes "pods_for_logs" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods_for_logs.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_uid",
                           "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        // Add a static cluster label
        stage.static_labels {
          values = { cluster = "ceph-lab" }
        }
        // Try to parse JSON logs first, fall back to logfmt
        stage.json {
          expressions = {
            level  = "level",
            msg    = "msg",
            ts     = "ts",
          }
        }
        // ── Ceph / Rook log enrichment ────────────────────────────────────
        // Ceph daemons emit structured lines like:
        //   2024-01-01T00:00:00.000Z 7f... osd.0 10 0 :bluestore DEBUG ...
        // Extract daemon type, subsystem, and log level for better filtering in Loki.
        stage.match {
          selector = "{namespace=\"rook-ceph\"}"
          pipeline_name = "ceph_logs"

          // Pull the daemon name out of the Ceph log prefix (e.g. osd.0, mgr.a, mon.b)
          stage.regex {
            expression = "(?P<ceph_daemon>(osd|mgr|mon|mds|rgw|rbd-mirror|crash)\\.[^\\s]+)"
          }
          stage.labels {
            values = { ceph_daemon = "" }
          }

          // Extract log level from Ceph daemon output (DEBUG, INFO, WARNING, ERR)
          stage.regex {
            expression = "(?i) (?P<ceph_level>DEBUG|INFO|NOTICE|WARNING|ERR|CRITICAL|ALERT|EMERG)[ :]"
          }
          stage.labels {
            values = { ceph_level = "" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // ── OTLP trace receiver → Tempo ───────────────────────────────────────
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.tracing.svc.cluster.local:4317"
          tls { insecure = true }
        }
      }

  controller:
    type: daemonset

  # Resource requests tuned for a 6 GB worker node sharing space with Ceph OSDs
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
