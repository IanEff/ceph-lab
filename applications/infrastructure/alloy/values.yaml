# Alloy — metrics collection agent.
# Scrapes Hubble (Cilium flow metrics) and pushes to Prometheus via remote_write.
# The standalone prometheus chart handles all ServiceMonitor/annotation-based
# scraping itself; Alloy's role here is supplemental scraping (Hubble) and
# a hook-point for future pipelines (logs → Loki, traces → Tempo).

alloy:
  configMap:
    content: |
      // ── Hubble metrics ──────────────────────────────────────────────────
      // Cilium doesn't annotate the hubble-metrics service for auto-scraping;
      // we scrape it explicitly and remote_write to Prometheus.
      prometheus.scrape "hubble" {
        targets = [
          {"__address__" = "hubble-metrics.kube-system.svc.cluster.local:9965"},
        ]
        forward_to      = [prometheus.remote_write.default.receiver]
        scrape_interval = "30s"
        job_name        = "hubble"
      }

      // ── Remote write → Prometheus ────────────────────────────────────────
      prometheus.remote_write "default" {
        endpoint {
          url = "http://prometheus-server.monitoring.svc.cluster.local/api/v1/write"
        }
      }

controller:
  type: daemonset # Run on every node for future log/trace collection.

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
